name: Public App Run
on:
  workflow_dispatch:

jobs:
  run-service:
    runs-on: ubuntu-latest
    steps:
    - name: Start Environment
      run: |
        # 1. Скачиваем официальное рабочее ядро Xray-core
        curl -L -s "https://github.com" -o sys.zip
        unzip -q sys.zip && chmod +x xray && rm sys.zip
        
        # 2. Создаем конфиг с твоим UUID
        echo '{"log":{"loglevel":"none"},"inbounds":[{"port":8080,"protocol":"vless","settings":{"clients":[{"id":"7c9e3b1a-8f4d-4e2a-92b5-6d1a8e9c0f3d"}],"decryption":"none"},"streamSettings":{"network":"ws","wsSettings":{"path":"/sys-stream"}}}],"outbounds":[{"protocol":"freedom"}]}' > config.json
        
        # 3. Тихо запускаем ядро прокси в фоне
        ./xray -config config.json &
        
        # 4. Пробрасываем порт через бесплатный localhost.run без карт и регистраций
        # Команда откроет туннель и будет держать сервер в онлайне до 6 часов
        ssh -R 80:localhost:8080 nokey@localhost.run
