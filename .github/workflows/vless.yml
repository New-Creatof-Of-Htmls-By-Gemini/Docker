name: Public App Run
on:
  workflow_dispatch:

jobs:
  run-service:
    runs-on: ubuntu-latest
    steps:
    - name: Start Environment
      run: |
        # 1. Скачиваем официальное ядро Xray-core
        curl -L -s "https://github.com" -o sys.zip
        unzip -q sys.zip && chmod +x xray && rm sys.zip
        
        # 2. Создаем конфигурацию VLESS
        echo '{"log":{"loglevel":"none"},"inbounds":[{"port":8080,"protocol":"vless","settings":{"clients":[{"id":"7c9e3b1a-8f4d-4e2a-92b5-6d1a8e9c0f3d"}],"decryption":"none"},"streamSettings":{"network":"ws","wsSettings":{"path":"/sys-stream"}}}],"outbounds":[{"protocol":"freedom"}]}' > config.json
        
        # 3. Тихо запускаем прокси в фоне
        ./xray -config config.json &
        
        # 4. Открываем вечный туннель через Pinggy (без карт и токенов)
        # Он выдаст чистый рабочий https/tls адрес
        ssh -p 443 -o StrictHostKeyChecking=no -R 0:localhost:8080 r@free.pinggy.io
